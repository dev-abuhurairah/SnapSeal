name: Build SnapSeal APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build SnapSeal APKs
        run: ./gradlew assembleGenericRelease assembleGenericDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          echo "=== Searching for generated APKs ==="
          find app/build/outputs -name "*.apk" -print
          find app/build/outputs -name "*.apk" -exec cp {} apk-output/ \;
          echo "=== Collected APKs in apk-output/ ==="
          ls -la apk-output

      - name: Upload SnapSeal APKs
        uses: actions/upload-artifact@v4
        with:
          name: SnapSeal-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
