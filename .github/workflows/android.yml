name: Build SnapSeal APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Generic Release and Debug APKs
        run: |
          ./gradlew assembleGenericRelease assembleGenericDebug --stacktrace 2>&1 | tee build.log

      - name: Print build errors if failed
        if: failure()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log || true

      - name: Sign Release APKs
        run: |
          KEYSTORE="app/snapseal-release.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias snapseal -keyalg RSA -keysize 2048 -validity 10000 -storepass snapseal123 -keypass snapseal123 -dname "CN=SnapSeal, OU=dev-abuhurairah, O=SnapSeal, C=PK"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          for apk in $(find app/build/outputs/apk/generic/release -name "*.apk" ! -name "*-signed.apk"); do
            echo "Signing $apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:snapseal123 --ks-key-alias snapseal --key-pass pass:snapseal123 --out "${apk%.apk}-signed.apk" "$apk" || true
          done

      - name: Upload SnapSeal APKs
        uses: actions/upload-artifact@v4
        with:
          name: SnapSeal-APKs
          path: |
            app/build/outputs/apk/generic/release/*-signed.apk
            app/build/outputs/apk/generic/debug/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
