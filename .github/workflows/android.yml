name: Build SnapSeal APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build SnapSeal Generic Release APK
        run: |
          ./gradlew assembleGenericRelease --stacktrace > build.log 2>&1 || BUILD_FAILED=true
          if [ "$BUILD_FAILED" = "true" ]; then
            echo "=== GRADLE BUILD FAILED ==="
            tail -n 100 build.log
            KOTLIN_ERR=$(grep -E "^e: " build.log | head -n 10 | tr '\n' ' | ')
            if [ -n "$KOTLIN_ERR" ]; then
              echo "::error title=KotlinError::$KOTLIN_ERR"
            else
              ERROR_MSG=$(grep -A 5 "What went wrong:" build.log | head -n 5 | tr '\n' ' ')
              echo "::error title=GradleBuildError::$ERROR_MSG"
            fi
            exit 1
          fi

      - name: Sign APKs
        run: |
          mkdir -p apk-output
          keytool -genkeypair -v -keystore release.jks -alias snapseal -keyalg RSA -keysize 2048 -validity 10000 -storepass snapseal123 -keypass snapseal123 -dname "CN=SnapSeal, OU=dev-abuhurairah, O=SnapSeal, C=PK"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "Signing $apk ..."
            filename=$(basename "$apk")
            "$APKSIGNER" sign --ks release.jks --ks-pass pass:snapseal123 --ks-key-alias snapseal --key-pass pass:snapseal123 --out "apk-output/$filename" "$apk"
          done

          echo "Final signed APKs in apk-output/:"
          ls -la apk-output/

      - name: Upload SnapSeal APKs
        uses: actions/upload-artifact@v4
        with:
          name: SnapSeal-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
